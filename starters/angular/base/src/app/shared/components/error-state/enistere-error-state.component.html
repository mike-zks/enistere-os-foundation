<div class="error-state" role="alert" aria-live="assertive">
  <h2 class="state-title">{{ title() }}</h2>
  @if (description()) {
    <p class="state-description">{{ description() }}</p>
  }
  @if (retryLabel()) {
    <button mat-flat-button class="state-retry" (click)="retried.emit()">
      {{ retryLabel() }}
    </button>
  }
</div>
