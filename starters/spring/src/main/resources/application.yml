server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: enistere-api-spring-core
  # Persistence + migrations are base infrastructure (ADR-056). Flyway is authoritative;
  # Hibernate only validates. Capabilities add their own migrations after the base baseline.
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/enistere}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:enistere}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:change-me}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

# Structured JSON logs on stdout (ADR-049), correlated by the requestId MDC
# (CorrelationIdFilter). Collection is a Deployment concern — no embedded transport.
logging:
  structured:
    format:
      console: ecs

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

enistere:
  runtime:
    service-name: ${SERVICE_NAME:api-spring-core}
    shutdown-timeout-seconds: ${SHUTDOWN_TIMEOUT_SECONDS:20}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
