# Datasource, JPA and Flyway are provided by the base (ADR-056). This overlay
# only adds auth-specific configuration.
enistere.security.jwt.secret=${JWT_ACCESS_SECRET}
enistere.security.jwt.expiration=${JWT_ACCESS_EXPIRATION_SECONDS:900}
enistere.security.argon2.salt-length=${ARGON2_SALT_LENGTH:16}
enistere.security.argon2.hash-length=${ARGON2_HASH_LENGTH:32}
enistere.security.argon2.parallelism=${ARGON2_PARALLELISM:1}
enistere.security.argon2.memory=${ARGON2_MEMORY_KIB:65536}
enistere.security.argon2.iterations=${ARGON2_ITERATIONS:3}
