# Alembic configuration, brought by the persistence primitive.
#
# `sqlalchemy.url` is deliberately absent: the URL comes from the environment
# through app.persistence.config, so a connection string is never committed and
# the migration runner cannot drift from the application it migrates.
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
