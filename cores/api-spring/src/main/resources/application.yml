server:
  port: 8080

spring:
  application:
    name: enistere-api-spring-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/enistere_dev}
    username: ${DB_USERNAME:enistere}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none        # Flyway is authoritative — never create/drop schema
    show-sql: false
    open-in-view: false     # Disable OSIV
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.enistere: DEBUG
    org.springframework.security: WARN
    org.flywaydb: INFO

enistere:
  security:
    jwt:
      # PRODUCTION: override with JWT_SECRET env var (min 32 bytes, cryptographically random)
      secret: ${JWT_SECRET:enistere-dev-only-jwt-secret-starter-2026-not-for-production}
      expiration: 900  # access token lifetime in seconds (15 min)
    argon2:
      salt-length: 16
      hash-length: 32
      parallelism: 1
      memory: 65536     # 64 MB — OWASP minimum recommendation
      iterations: 3
