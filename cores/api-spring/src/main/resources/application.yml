server:
  port: 8080

spring:
  application:
    name: enistere-api-spring-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/enistere_dev}
    username: ${DB_USERNAME:enistere}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none        # Flyway is authoritative — never create/drop schema
    show-sql: false
    open-in-view: false     # Disable OSIV
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 11MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.enistere: DEBUG
    org.springframework.security: WARN
    org.flywaydb: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

enistere:
  security:
    jwt:
      # PRODUCTION: override with JWT_SECRET env var (min 32 bytes, cryptographically random)
      secret: ${JWT_SECRET:enistere-dev-only-jwt-secret-starter-2026-not-for-production}
      expiration: 900  # access token lifetime in seconds (15 min)
    argon2:
      salt-length: 16
      hash-length: 32
      parallelism: 1
      memory: 65536     # 64 MB — OWASP minimum recommendation
      iterations: 3
    cors:
      # PRODUCTION: override with CORS_ALLOWED_ORIGINS env var (comma-separated list of origins)
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:8080,http://localhost:8081,http://localhost:19006}
  files:
    # PRODUCTION: override all enistere.files.* via environment variables — never commit real secrets
    endpoint: ${FILES_ENDPOINT:http://localhost:9000}
    bucket: ${FILES_BUCKET:enistere-dev}
    region: ${FILES_REGION:us-east-1}
    access-key: ${FILES_ACCESS_KEY:minioadmin}
    secret-key: ${FILES_SECRET_KEY:minioadmin}
    presigned-url-ttl-seconds: ${FILES_PRESIGNED_TTL_SECONDS:300}
