enistere:
  security:
    jwt:
      secret: test-jwt-secret-for-junit-only-not-for-production-min32c
      expiration: 60
    argon2:
      memory: 4096      # 4 MB — fast for tests only, not production-grade (ADR-039 §22)
      iterations: 1
      parallelism: 1
    rate-limit:
      enabled: false    # disabled by default in tests; individual test classes re-enable via @TestPropertySource
  files:
    endpoint: http://localhost:9000
    bucket: test-bucket
    region: us-east-1
    access-key: test-access-key
    secret-key: test-secret-key

management:
  endpoint:
    health:
      show-details: always  # expose health component details in tests
  health:
    redis:
      enabled: false        # disabled by default in tests; RedisHealthIntegrationTest re-enables via @TestPropertySource

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    io.lettuce: ERROR
    io.netty: ERROR
