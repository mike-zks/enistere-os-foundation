name: Web E2E CI

# Deployment 3 — CI E2E navigateur (niveau 3), baseline `base`. Démarre une stack RÉELLE et
# ÉPHÉMÈRE (PostgreSQL jetable, API NestJS `base`, Web Next.js `base`) et rejoue les parcours
# navigateur de la baseline (Health / page de statut) avec Chromium headless (Playwright).
# SANS déploiement, registry/GHCR, secret GitHub ni environnement protégé.
#
# Depuis Capability Packs 1A, les baselines ne contiennent ni Auth ni Files : plus de MinIO/S3,
# plus de secrets JWT, plus de seed RBAC ni de provisionnement de fichiers. Les parcours composés
# (login, files) sont vérifiés par les goldens `base+auth`/`base+files` de la Factory, hors dépôt.
# Valeurs ci-dessous = VALEURS DE TEST JETABLES (jamais des secrets, jamais committées en `.env`).

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: web-e2e-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-e2e:
    name: web-e2e
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: enistere_e2e
          POSTGRES_USER: enistere
          POSTGRES_PASSWORD: enistere_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enistere -d enistere_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # --- API baseline (valeurs de test jetables) ---
      DATABASE_URL: postgresql://enistere:enistere_test_password@localhost:5432/enistere_e2e?schema=public
      CORS_ORIGINS: http://127.0.0.1:3100,http://127.0.0.1:3001
      PORT: "3001"
      SERVICE_NAME: api-nestjs-core
      LOG_LEVEL: warn
      # --- Web baseline ---
      APP_ENV: development
      API_INTERNAL_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      # --- E2E ---
      E2E_API_URL: http://127.0.0.1:3001
      E2E_WEB_URL: http://127.0.0.1:3100

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace + build packages
        run: |
          npm ci
          npm run build --workspace=@enistere/api-contracts
          npm run build --workspace=@enistere/api-client-fetch
          npm run build --workspace=@enistere/ui-kit

      - name: Install Playwright (chromium)
        run: npm run e2e:install --workspace=@enistere/web-nextjs

      - name: Install + prepare API baseline (autonome)
        working-directory: starters/nestjs
        run: |
          npm ci
          npm run prisma:generate
          npm run prisma:migrate:deploy
          npm run build

      - name: Start API (background) + wait ready
        working-directory: starters/nestjs
        run: |
          nohup node dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:3001/health/ready >/dev/null 2>&1 && { echo "API ready"; break; } || sleep 2
          done
          curl -fsS http://127.0.0.1:3001/health/ready >/dev/null 2>&1 || { echo "API NOT ready"; tail -30 /tmp/api.log; exit 1; }

      - name: Build + start Web (background) + wait
        run: |
          npm run build --workspace=@enistere/web-nextjs
          nohup npm run start --workspace=@enistere/web-nextjs > /tmp/web.log 2>&1 &
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:3100/ >/dev/null 2>&1 && { echo "Web up"; break; } || sleep 2
          done
          curl -fsS http://127.0.0.1:3100/ >/dev/null 2>&1 || { echo "Web NOT up"; tail -30 /tmp/web.log; exit 1; }

      - name: Run E2E (Playwright, headless)
        run: npm run test:e2e --workspace=@enistere/web-nextjs
