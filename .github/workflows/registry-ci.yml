name: Registry CI

# Cloud Core 5 — début d'ADR-014 (registry UNIQUEMENT). Construit les images API et Web ; les **pousse**
# vers GHCR seulement sur `push` de `main`. **Aucun déploiement, aucun secret applicatif, aucun PAT**
# (auth via le `GITHUB_TOKEN` automatique). PR = build SANS push (vérifie que les images sont constructibles).
#
# Images : ghcr.io/<owner>/<repo>/api-nestjs et /web-nextjs (owner/repo dérivés de github.repository).
# Tags : sha-<short> (toujours) ; main-<short> (sur main) ; pr-<n> (build PR, non poussé). PAS de `latest`.

on:
  pull_request:
  push:
    branches:
      - main

# `packages: write` n'est utilisé que pour le push sur main (login conditionnel). Sinon lecture seule.
permissions:
  contents: read
  packages: write

concurrency:
  group: registry-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-nestjs
            context: ./cores/api-nestjs
            file: ./cores/api-nestjs/Dockerfile
          - name: web-nextjs
            context: .
            file: ./cores/web-nextjs/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Login GHCR UNIQUEMENT sur push main (jamais en PR, jamais depuis un fork). Token automatique, pas de PAT.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Métadonnées : nom d'image en minuscules, tags immuables, labels OCI. `latest` désactivé.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=sha,prefix=main-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=pr-${{ github.event.number }},enable=${{ github.event_name == 'pull_request' }}
          labels: |
            org.opencontainers.image.title=enistere-${{ matrix.name }}
            org.opencontainers.image.description=Enistere OS Foundation — image ${{ matrix.name }} (sans déploiement)

      # PR → build seul (push:false). Push main → build + push GHCR.
      - name: Build${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && ' and push' || ' only (no push)' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
