name: Registry CI

# Cloud Core 5 — début d'ADR-014 (registry UNIQUEMENT). Construit les images API et Web ; les **pousse**
# vers GHCR seulement sur `push` de `main`. **Aucun déploiement, aucun secret applicatif, aucun PAT**
# (auth via le `GITHUB_TOKEN` automatique). PR = build SANS push (vérifie que les images sont constructibles).
#
# Images : ghcr.io/<owner>/<repo>/api-nestjs et /web-nextjs (owner/repo dérivés de github.repository).
# Tags : sha-<short> (toujours) ; main-<short> (sur main) ; pr-<n> (build PR, non poussé). PAS de `latest`.

on:
  pull_request:
  push:
    branches:
      - main

# `packages: write` n'est utilisé que pour le push sur main (login conditionnel). Sinon lecture seule.
permissions:
  contents: read
  packages: write

concurrency:
  group: registry-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cloud Core 8 — ferme l'angle mort CI : l'image API était buildée mais JAMAIS exécutée, ce qui a laissé
  # passer un défaut runtime (moteur Prisma incompatible OpenSSL → crash-loop, cf. STAGING_DRY_RUN_REPORT.md).
  # Ce job construit l'image API, la LANCE, et vérifie que le moteur de requête Prisma se charge au runtime
  # (sans base de données : une erreur de CONNEXION prouve que le moteur a chargé ; une erreur « moteur
  # introuvable » fait ÉCHOUER le job). Le push (job `images`) est conditionné à la réussite de ce smoke.
  api-smoke:
    name: api-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image (load local, no push)
        uses: docker/build-push-action@v6
        with:
          context: ./starters/nestjs
          file: ./starters/nestjs/Dockerfile
          push: false
          load: true
          tags: enistere-api-smoke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — runtime non-root, openssl, moteur Prisma présent
        run: |
          docker run --rm enistere-api-smoke:ci id
          docker run --rm --entrypoint sh enistere-api-smoke:ci -lc \
            'openssl version && echo "engines in .prisma/client:" && ls node_modules/.prisma/client/ | grep -E "\.so\.node$"'

      - name: Smoke — le moteur de requête Prisma se charge au runtime (DB-less)
        run: |
          # DATABASE_URL bidon (port 1) : on attend une erreur de CONNEXION (moteur chargé = OK),
          # PAS une erreur « query engine could not be located » (moteur absent/incompatible = FAIL).
          docker run --rm -e DATABASE_URL='postgresql://smoke:smoke@127.0.0.1:1/smoke?schema=public' \
            enistere-api-smoke:ci node -e '
              const { PrismaClient } = require("@prisma/client");
              const p = new PrismaClient();
              p.$connect()
                .then(() => { console.log("SMOKE_OK: engine loaded + connected"); process.exit(0); })
                .catch((e) => {
                  const m = String((e && e.message) || e);
                  if (/query engine|could not be located|libquery|Unable to (require|load)/i.test(m)) {
                    console.error("SMOKE_FAIL: prisma query engine not loadable at runtime");
                    console.error(m.split("\n").slice(0, 4).join("\n"));
                    process.exit(1);
                  }
                  console.log("SMOKE_OK: engine loaded (DB unreachable as expected): " + m.split("\n")[0]);
                  process.exit(0);
                });
            '

  images:
    name: images
    # Cloud Core 8 : ne publier les images que si le smoke-run de l'image API a réussi.
    needs: api-smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-nestjs
            context: ./starters/nestjs
            file: ./starters/nestjs/Dockerfile
          - name: web-nextjs
            context: .
            file: ./starters/nextjs/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Login GHCR UNIQUEMENT sur push main (jamais en PR, jamais depuis un fork). Token automatique, pas de PAT.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Métadonnées : nom d'image en minuscules, tags immuables, labels OCI. `latest` désactivé.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=sha,prefix=main-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=pr-${{ github.event.number }},enable=${{ github.event_name == 'pull_request' }}
          labels: |
            org.opencontainers.image.title=enistere-${{ matrix.name }}
            org.opencontainers.image.description=Enistere OS Foundation — image ${{ matrix.name }} (sans déploiement)

      # PR → build seul (push:false). Push main → build + push GHCR.
      - name: Build${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && ' and push' || ' only (no push)' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
