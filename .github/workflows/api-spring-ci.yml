name: API Spring CI

# Gate CI dédié api-spring — Spring Boot 4.1.0 / Java 21 / Maven Wrapper.
# Valide : compilation, Flyway migrations V1+V2, tests unitaires (32) + intégration (39)
# avec Testcontainers PostgreSQL (postgres:16-alpine démarré automatiquement par TC).
# FakeStorageService @Profile("test") — aucun MinIO réel, aucun secret, aucun déploiement.
# Docker requis pour Testcontainers : disponible nativement sur ubuntu-latest.
# Toutes les valeurs de test sont jetables et inoffensives.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: api-spring-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-spring-verify:
    name: api-spring-verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x starters/spring/mvnw

      - name: api-spring verify (71 tests — unit + Testcontainers PostgreSQL)
        working-directory: starters/spring
        run: ./mvnw verify --no-transfer-progress
