name: Factory Golden Runtime

# Capability Packs 1A-R — preuve runtime des compositions générées.
# Pour chaque golden, la Factory GÉNÈRE le projet dans un répertoire temporaire, prouve
# l'installation reproductible (`npm install` puis `npm ci` depuis le lock racine unique) et
# exécute les gates RÉELS de chaque application générée (voir factory/quality/scripts/golden-runtime.mjs).
#
# Aucune infrastructure persistante : PostgreSQL jetable en service. Aucune valeur ci-dessous
# n'est un secret réel — ce sont des VALEURS DE TEST JETABLES. Aucun déploiement, registry ni publication.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: factory-golden-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Contrat de dépendances (moitié réseau) : `generate --install` produit réellement le lock,
  # `npm ci` fonctionne immédiatement, et une même Foundation + un même blueprint résolvent
  # au même lock et au même digest. Opt-in via ENISTERE_NETWORK_TESTS — jamais silencieusement ignoré ici.
  dependency-contract:
    name: dependency-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Dependency finalization tests (network)
        env:
          ENISTERE_NETWORK_TESTS: "1"
        run: node --test factory/test/dependencies-install.test.mjs

  golden-runtime:
    name: golden-runtime (${{ matrix.composition }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        composition:
          - nestjs-base
          - nestjs-auth
          - nest-next-auth
          - triple-auth
          - nestjs-auth-rbac
          - nest-next-auth-rbac
          - triple-auth-rbac
          - nestjs-files
          - nest-next-files
          - triple-files
          - spring-base
          - fastapi-base
          - spring-auth
          - spring-auth-rbac
          - spring-files
          - spring-next-base
          - spring-react-native-base
          - spring-angular-base
          - spring-flutter-base
          - nestjs-next-base
          - nestjs-react-native-base
          - nestjs-angular-base
          - nestjs-flutter-base
          - nestjs-angular-auth
          - nestjs-flutter-auth
          - fastapi-auth
          - fastapi-rbac
          - distributed-spring-nestjs

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: enistere_golden
          POSTGRES_USER: enistere
          POSTGRES_PASSWORD: enistere_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enistere -d enistere_golden"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Valeurs de test JETABLES (jamais des secrets réels ; cf. deployment/docs/SECRETS_POLICY.md).
      GOLDEN_RUNTIME_DB: "1"
      DATABASE_URL: postgresql://enistere:enistere_test_password@localhost:5432/enistere_golden?schema=public
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/enistere_golden
      SPRING_DATASOURCE_USERNAME: enistere
      SPRING_DATASOURCE_PASSWORD: enistere_test_password
      JWT_ACCESS_SECRET: golden_ci_access_secret_minimum_32_characters
      JWT_REFRESH_SECRET: golden_ci_refresh_secret_minimum_32_characters
      REFRESH_TOKEN_HASH_SECRET: golden_ci_refresh_hash_secret_minimum_32_chars
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: golden_runtime_test_access_key
      S3_SECRET_ACCESS_KEY: golden_runtime_test_secret_key
      S3_BUCKET: enistere-golden-files
      S3_FORCE_PATH_STYLE: "true"
      # Rate limits généreux pour ne pas faire échouer les e2e fonctionnels.
      AUTH_LOGIN_RATE_LIMIT: "1000"
      AUTH_REFRESH_RATE_LIMIT: "1000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        if: contains(matrix.composition, 'spring')
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-python@v5
        if: contains(matrix.composition, 'fastapi')
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: starters/fastapi/requirements.lock

      - uses: subosito/flutter-action@v2
        if: contains(matrix.composition, 'flutter')
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Start disposable MinIO for Files compositions
        if: contains(matrix.composition, 'files')
        run: |
          docker run --detach --rm --name enistere-golden-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=golden_runtime_test_access_key \
            --env MINIO_ROOT_PASSWORD=golden_runtime_test_secret_key \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs enistere-golden-minio
          exit 1

      # Reset the disposable schema between reruns (deterministic migrate deploy).
      - name: Reset PostgreSQL schema
        run: |
          PGPASSWORD=enistere_test_password psql -h localhost -U enistere -d enistere_golden \
            -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public; \
                DROP SCHEMA IF EXISTS authority_core_api CASCADE; \
                DROP SCHEMA IF EXISTS authority_engagement_api CASCADE; \
                CREATE SCHEMA authority_core_api AUTHORIZATION enistere; \
                CREATE SCHEMA authority_engagement_api AUTHORIZATION enistere;"

      - name: Golden runtime — generate, reproducible install, gates
        env:
          # La preuve de boot + contrat HTTP est obligatoire sur les trois
          # références API de base, sans multiplier inutilement les démarrages.
          GOLDEN_RUNTIME_START: ${{ (matrix.composition == 'nestjs-base' || matrix.composition == 'spring-base' || matrix.composition == 'fastapi-base' || matrix.composition == 'distributed-spring-nestjs') && '1' || '0' }}
        run: node factory/quality/scripts/golden-runtime.mjs ${{ matrix.composition }}

      # La régénération n'est prouvée que si elle l'est à chaque changement, et
      # sur chaque famille : un projet existant, du travail de son propriétaire,
      # une capability ajoutée — puis les mêmes gates qu'un projet généré
      # directement (ADR-083). FastAPI porte en plus le cas des migrations
      # chaînées (ADR-084).
      - name: Golden runtime — regenerate an existing project
        if: matrix.composition == 'nestjs-auth'
        run: node factory/quality/scripts/golden-runtime.mjs nestjs-auth --regenerate-from nestjs-base

      - name: Golden runtime — regenerate (API non-JS)
        if: matrix.composition == 'fastapi-auth'
        run: node factory/quality/scripts/golden-runtime.mjs fastapi-auth --regenerate-from fastapi-base

      - name: Golden runtime — regenerate (Web)
        if: matrix.composition == 'nest-next-auth'
        run: node factory/quality/scripts/golden-runtime.mjs nest-next-auth --regenerate-from nestjs-next-base

      - name: Golden runtime — regenerate (Mobile)
        if: matrix.composition == 'nestjs-flutter-auth'
        run: node factory/quality/scripts/golden-runtime.mjs nestjs-flutter-auth --regenerate-from nestjs-flutter-base
